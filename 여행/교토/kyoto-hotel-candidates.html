  --bg:#14181F; --surface:#1C222B; --ink:#E7E9EC; --muted:#9AA1AB; --line:#2E3540;

.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--font-display);font-size:1.75rem;margin:0;text-wrap:balance}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}

.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;position:sticky;top:max(12px, env(safe-area-inset-top, 0px))}

.sw{width:18px;height:4px;border-radius:2px;display:inline-block}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.note{font-size:.75rem;color:var(--muted);padding:4px}
.list{display:flex;flex-direction:column;gap:8px}
.card{user-select:text;-webkit-user-select:text;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--hotel);box-shadow:0 0 0 1px var(--hotel)}
.num{width:26px;height:26px;border-radius:50%;background:var(--hotel);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.card h3{margin:0;font-size:.98rem;font-weight:700;cursor:text}
.card .sub{font-size:.8rem;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{border-color:var(--subway);color:var(--subway)}
.chip.warn{border-color:var(--hotel);color:var(--hotel)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.photos figure{margin:0;position:relative;min-width:0}
.photos img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;display:block;background:var(--street)}
.photos figcaption{position:absolute;left:6px;bottom:6px;font-size:.68rem;padding:1px 6px;border-radius:4px;background:rgba(20,24,31,.65);color:#fff}
.credit{font-size:.68rem;color:var(--muted);margin-top:3px}

.h-num{font-size:11px;font-weight:700;fill:var(--surface);font-family:var(--font-body);pointer-events:none}

<script>

const W=800,H=760,PAD=20;
const kx=Math.cos(35*Math.PI/180);
const spanX=(B.lonMax-B.lonMin)*kx, spanY=(B.latMax-B.latMin);
const s=Math.min((W-2*PAD)/spanX,(H-2*PAD)/spanY);
const ox=(W-spanX*s)/2, oy=(H-spanY*s)/2;
const P=(lat,lon)=>[ox+(lon-B.lonMin)*kx*s, oy+(B.latMax-lat)*s];

  {id:"sanjo",name:"산조 (게이한)",lat:35.00902,lon:135.77233,dx:9,dy:4,anchor:"start"},
];
const places=[
  {name:"다카시마야",lat:35.00307,lon:135.76843,dx:-6,dy:14,anchor:"end"},
  {name:"다이마루",lat:35.00437,lon:135.76190,dx:6,dy:-6,anchor:"start"},

   price:"약 ¥31,000~ (조식 포함, 최저가)",budget:"ok",feel:"일본식 ★★☆",

   q:"THE GATE HOTEL 京都高瀬川 by HULIC"},
  {n:2,name:"소라니와 테라스 교토 벳테이",area:"가와라마치",lat:35.00252,lon:135.76970,exact:true,

  {n:9,name:"솔라리아 니시테츠 호텔 교토 프리미어 산조카모가와 (4성급)",area:"산조·가모강변",lat:35.01060,lon:135.77082,exact:true,
   price:"약 ¥12,400~ (최저가, 날짜 미상)",budget:"ok",feel:"일본식 ★★☆",
   pts:["지하철 도자이선 교토시야쿠쇼마에역 도보 1분, 게이한 산조역 도보 2분","지하 대욕장 (남녀, 15:00~25:00 / 6:00~9:00), 정원 뷰 객실","200실, 전 객실 욕실·화장실 분리. 가와라마치 쇼핑가까지 도보 약 10분"],
   q:"ソラリア西鉄ホテル京都プレミア 三条鴨川"},
];

  {name:"히가시오지도리",pts:[[B.latMax,135.7790],[34.9930,135.7790]],lab:null},
];

line([[B.latMax,135.7725],[35.0090,135.7717],[35.0035,135.7709],[34.9995,135.7693],[34.9960,135.7682],[34.9900,135.7672],[B.latMin,135.7680]],
  {stroke:"var(--river)","stroke-width":14,"stroke-linecap":"round","stroke-linejoin":"round"});
{const [x,y]=P(34.9905,135.7676);const t=el("text",{x:x+12,y:y,class:"street-label"});t.textContent="가모강";}

[["가라스마도리",35.0125,135.7596],["가와라마치도리",35.0125,135.7690],["히가시오지도리",35.0125,135.7790]].forEach(([n,la,lo])=>{

  el("circle",{cx:x,cy:y,r:6.5,fill:"var(--surface)",stroke:"var(--ink)","stroke-width":2.2});
  const t=el("text",{x:x+st.dx,y:y+st.dy,class:"st-label","text-anchor":st.anchor});t.textContent=st.name;});

// 가장 가까운 역 연결선 (선택 시)
const linkLine=el("line",{stroke:"var(--hotel)","stroke-width":2,"stroke-dasharray":"4 4",visibility:"hidden"});
const linkText=el("text",{class:"st-label","text-anchor":"middle",visibility:"hidden"});
linkText.style.fill="var(--hotel)";

// 거리 계산
const R=6371000,rad=d=>d*Math.PI/180;
const dist=(a,b)=>{const dLa=rad(b.lat-a.lat),dLo=rad(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const nearest=h=>stations.map(s=>({s,d:dist(h,s)})).sort((a,b)=>a.d-b.d);

// 호텔 핀
const pins={};
hotels.forEach(h=>{const [x,y]=P(h.lat,h.lon);
  const g=el("g",{class:"hotel-pin",tabindex:"0",role:"button","aria-label":h.name});
  const c=el("circle",{cx:x,cy:y,r:10,fill:"var(--hotel)",stroke:"var(--surface)","stroke-width":2},g);
  const t=el("text",{x:x,y:y+4,class:"h-num","text-anchor":"middle"},g);t.textContent=h.exact?h.n:h.n+"△";
  if(!h.exact)t.setAttribute("font-size","9");
  g.addEventListener("click",()=>select(h.n,true));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(h.n,true);}});
  pins[h.n]={g,c};
});

// 목록
const list=document.getElementById("list");
const cards={};
hotels.forEach(h=>{
  const near=nearest(h).slice(0,2);
  const b=document.createElement("div");b.className="card";b.tabIndex=0;b.setAttribute("role","button");b.id="hotel-"+h.n;b.setAttribute("aria-pressed","false");
  b.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target===b){e.preventDefault();select(h.n,false);}});
  const mapsUrl="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(h.q+" 京都");
  const naverUrl="https://search.naver.com/search.naver?query="+encodeURIComponent(h.name.replace(/\s*\(4성급\)/,"")+" 교토 호텔");
  b.innerHTML=`<span class="num">${h.n}</span><div style="min-width:0">
    <h3>${h.name}</h3><div class="sub">${h.area}${h.exact?"":" · 추정 위치"}</div>
    <div class="photos">${["a","b"].filter(k=>photos[h.n][k]).map(k=>`<figure><img src="photos/h${h.n}-${k}.jpg" alt="${h.name} ${photos[h.n][k]}" loading="lazy"><figcaption>${photos[h.n][k]}</figcaption></figure>`).join("")}</div>
    <div class="credit">사진: ${photos[h.n].src}</div>
    <div class="meta"><span class="chip ${h.budget}">${h.price}</span><span class="chip">${h.feel}</span></div>
    <div class="detail"><ul>${h.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
      <div class="near">가까운 역 (직선거리): ${near.map(x=>`${x.s.name.split(" (")[0]} ${Math.round(x.d/10)*10}m`).join(" · ")}</div>
      <a href="${mapsUrl}" target="_blank" rel="noopener">구글 지도에서 보기 ↗</a>
      · <a href="${naverUrl}" target="_blank" rel="noopener">네이버에서 검색 ↗</a></div></div>`;
  b.addEventListener("click",e=>{if(e.target.closest("a"))return;
    const sel=window.getSelection&&window.getSelection().toString();if(sel)return; // 글자를 드래그한 경우에는 선택 유지
    select(h.n,false);});
  list.appendChild(b);cards[h.n]=b;
});

let current=null;
function select(n,fromMap){
  current=(current===n&&!fromMap)?null:n;
  hotels.forEach(h=>{const on=h.n===current;cards[h.n].setAttribute("aria-pressed",on);pins[h.n].c.setAttribute("r",on?14:10);});
  if(current==null){linkLine.setAttribute("visibility","hidden");linkText.setAttribute("visibility","hidden");return;}
  const h=hotels.find(x=>x.n===current);const nr=nearest(h)[0];
  const [x1,y1]=P(h.lat,h.lon),[x2,y2]=P(nr.s.lat,nr.s.lon);
  Object.entries({x1,y1,x2,y2}).forEach(([k,v])=>linkLine.setAttribute(k,v));
  linkLine.setAttribute("visibility","visible");
  linkText.setAttribute("x",(x1+x2)/2);linkText.setAttribute("y",(y1+y2)/2-8);
  linkText.textContent=`${Math.round(nr.d/10)*10}m · 도보 약 ${Math.max(1,Math.round(nr.d/80))}분`;
  linkText.setAttribute("visibility","visible");
  svg.appendChild(linkLine);svg.appendChild(linkText);
  Object.values(pins).forEach(p=>svg.appendChild(p.g));
  if(fromMap)cards[current].scrollIntoView({block:"nearest",behavior:"smooth"});
}
select(1,false);
document.getElementById("home-link").hidden=false;
</script>
</body>
</html>
