<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>태교여행 준비</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173d4b;
      --muted: #43616b;
      --paper: #fff;
      --mist: #edf5f7;
      --line: #d4e2e6;
      --blue: #1e55ad;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.6 "DM Sans", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      word-break: keep-all;
    }
    main { width: min(880px, calc(100% - 36px)); margin: 0 auto; padding: clamp(24px, 6vw, 68px) 0 44px; }
    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      background: var(--mist);
      border-radius: 24px;
      overflow: hidden;
    }
    h1 { margin: 0; padding: clamp(24px, 5vw, 56px); font-size: clamp(2rem, 6.1vw, 3.8rem); line-height: 1.15; letter-spacing: -.055em; }
    figure { position: relative; margin: 0; align-self: stretch; min-height: clamp(200px, 30vw, 310px); }
    figure img { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 55%; }
    figcaption { position: absolute; right: 12px; bottom: 12px; padding: 4px 9px; border-radius: 6px; background: #122d3a; color: #fff; font-size: .8rem; }
    nav { display: grid; gap: 27px; margin-top: clamp(24px, 5vw, 45px); }
    h2 { margin: 0 0 7px; font-size: .95rem; color: var(--muted); }
    ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    .page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 4px 18px;
      padding: 13px 10px;
      text-decoration: none;
      color: inherit;
    }
    .page strong { display: block; font-size: clamp(1.1rem, 2.75vw, 1.35rem); letter-spacing: -.025em; }
    .page span { display: block; color: var(--muted); font-size: .92rem; }
    .page .open { grid-row: 1 / span 2; grid-column: 2; color: var(--blue); font-size: .875rem; }
    .page:hover { background: var(--mist); }
    .page:hover strong { text-decoration: underline; text-underline-offset: .18em; }
    .page:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
    @media (max-width: 510px) {
      .intro { grid-template-columns: 1fr; }
      figure { min-height: 145px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --ink: #e0eff3; --muted: #aec7cf; --paper: #13242a; --mist: #1e363e; --line: #35535e; --blue: #a7cbff; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <h1>태교여행 준비</h1>
      <figure>
        <img src="assets/hotels/optimized/kyoto-ritz.jpg" width="900" height="507" alt="해질 무렵 가모가와 건너편에서 바라본 리츠칼튼 교토">
        <figcaption>교토 가모가와</figcaption>
      </figure>
    </header>
    <nav aria-label="준비 페이지">
      <section aria-labelledby="travel-title">
        <h2 id="travel-title">여행</h2>
        <ul>
          <li><a class="page" href="여행/index.html">
            <strong>태교여행 노트</strong>
            <span>여행지, 숙소, 항공편, 예산 비교</span>
            <span class="open" aria-hidden="true">열기 ›</span>
          </a></li>
          <li><a class="page" href="여행/교토/kyoto-hotel-map.html">
            <strong>교토 여행 지도</strong>
            <span>주요 관광지, 지하철, 중심상가, 호텔 후보</span>
            <span class="open" aria-hidden="true">열기 ›</span>
          </a></li>
          <li><a class="page" href="여행/교토/kyoto-hotel-candidates.html">
            <strong>교토 호텔 후보 지도</strong>
            <span>12/5~8 숙소 후보 9곳 · 역까지 거리, 가격대, 대표 사진</span>
            <span class="open" aria-hidden="true">열기 ›</span>
          </a></li>
        </ul>
      </section>
      <section aria-labelledby="shopping-title">
        <h2 id="shopping-title">쇼핑</h2>
        <ul>
          <li><a class="page" href="쇼핑/육아/japan-baby-shopping.html">
            <strong>일본 육아용품 체크리스트</strong>
            <span>살 물건을 확인하고 구매 여부 기록</span>
            <span class="open" aria-hidden="true">열기 ›</span>
          </a></li>
          <li><a class="page" href="쇼핑/육아/kyoto-baby-shop-map.html">
            <strong>교토 육아용품 지도</strong>
            <span>체크리스트 물건을 파는 매장과 가까운 역</span>
            <span class="open" aria-hidden="true">열기 ›</span>
          </a></li>
        </ul>
      </section>
    </nav>
  </main>
</body>
</html>
