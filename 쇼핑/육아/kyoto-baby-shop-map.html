}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181F; --surface:#1C222B; --ink:#E7E9EC; --muted:#9AA1AB; --line:#2E3540;
  --accent:#8FB0DA; --shop:#E58BA9; --area:#4A2A37; --hotel:#5E6672; --river:#24425A; --street:#262D37;
  --hankyu:#C97986; --subway:#5FBE88; --tozai:#E0A266; --keihan:#6FA6DE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181F; --surface:#1C222B; --ink:#E7E9EC; --muted:#9AA1AB; --line:#2E3540;
  --accent:#8FB0DA; --shop:#E58BA9; --area:#4A2A37; --hotel:#5E6672; --river:#24425A; --street:#262D37;
  --hankyu:#C97986; --subway:#5FBE88; --tozai:#E0A266; --keihan:#6FA6DE; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--font-display);font-size:1.75rem;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.home{color:var(--accent);font-size:.85rem;text-decoration:none}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;position:sticky;top:max(12px, env(safe-area-inset-top, 0px))}
@media (max-width:860px){.mapbox{position:static}}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);padding:8px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:4px;border-radius:2px;display:inline-block}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.note{font-size:.75rem;color:var(--muted);padding:4px}
.list{display:flex;flex-direction:column;gap:8px}
.group-title{font-size:.8rem;color:var(--muted);font-weight:700;margin:8px 2px 0;letter-spacing:.04em}
.card{user-select:text;-webkit-user-select:text;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--shop);box-shadow:0 0 0 1px var(--shop)}
.num{width:26px;height:26px;border-radius:50%;background:var(--shop);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.num.area{border-radius:6px}
.card h3{margin:0;font-size:.98rem;font-weight:700;cursor:text}
.card .sub{font-size:.8rem;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.type{border-color:var(--shop);color:var(--shop)}
.chip.warn{border-style:dashed}
.detail{margin-top:8px;font-size:.84rem;display:none}
.card[aria-pressed="true"] .detail{display:block}
.detail ul{margin:4px 0 6px;padding-left:18px}
.detail a{color:var(--accent)}
.st-label{font-size:11px;fill:var(--ink);font-family:var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.street-label{font-size:10px;fill:var(--muted);font-family:var(--font-body);letter-spacing:.04em}
.s-num{font-size:11px;font-weight:700;fill:var(--surface);font-family:var(--font-body);pointer-events:none}
.edge-label{font-size:11px;font-weight:700;fill:var(--shop);font-family:var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.shop-pin{cursor:pointer}
@media (prefers-reduced-motion: no-preference){.shop-pin circle,.shop-pin rect{transition:transform .15s}}

<div class="wrap">
  <header>
    <a id="home-link" class="home" href="../../index.html">‹ 태교여행 준비 홈</a>
    <h1>교토 육아용품 지도</h1>
    <p>일본 육아용품 체크리스트에 있는 물건을 어디서 살 수 있는지, 가까운 역과 함께 보여줘요. 번호나 목록을 누르면 가장 가까운 역까지 직선거리가 나와요.</p>
  </header>

  <div class="grid">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 800 820" role="img" aria-label="교토 시내 육아용품 매장과 역 위치 도식 지도"></svg>
      <div class="legend">
        <span><i class="sw" style="background:var(--hankyu)"></i>한큐 교토선</span>
        <span><i class="sw" style="background:var(--subway)"></i>지하철 가라스마선</span>
        <span><i class="sw" style="background:var(--tozai)"></i>지하철 도자이선</span>
        <span><i class="sw" style="background:var(--keihan)"></i>게이한선</span>
        <span><i class="dot" style="background:var(--shop)"></i>매장</span>
        <span><i class="dot" style="background:var(--area);border:1px solid var(--shop)"></i>드럭스토어 밀집 구역</span>
        <span><i class="dot" style="background:var(--hotel)"></i>숙소 후보</span>
      </div>
      <div class="note">거리와 노선은 실제 위치를 단순하게 그린 도식이에요. 화살표는 지도 밖에 있는 매장 방향이에요. 정확한 위치와 영업시간은 각 매장의 "구글 지도" 링크로 확인하세요.</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const B={latMin:34.9790,latMax:35.0135,lonMin:135.7500,lonMax:135.7880};
const W=800,H=820,PAD=20;
const kx=Math.cos(35*Math.PI/180);
const spanX=(B.lonMax-B.lonMin)*kx, spanY=(B.latMax-B.latMin);
const s=Math.min((W-2*PAD)/spanX,(H-2*PAD)/spanY);
const ox=(W-spanX*s)/2, oy=(H-spanY*s)/2;
const P=(lat,lon)=>[ox+(lon-B.lonMin)*kx*s, oy+(B.latMax-lat)*s];
const inside=(lat,lon)=>lat>=B.latMin&&lat<=B.latMax&&lon>=B.lonMin&&lon<=B.lonMax;

const stations=[
  {name:"교토가와라마치 (한큐)",lat:35.00376,lon:135.76961,dx:8,dy:18,anchor:"start"},

  {name:"산조 (게이한) / 산조케이한 (도자이선)",lat:35.00902,lon:135.77233,dx:9,dy:4,anchor:"start"},
];
const hotels=[
  [35.00590,135.76997],[35.00252,135.76970],[35.0000,135.7652],[35.00662,135.75683],
  [34.9930,135.7594],[34.99848,135.77370],[34.9966,135.7722],[35.0010,135.7699],[35.01060,135.77082]

// 매장 데이터 (체크리스트의 "where" 기준)

   type:"드럭스토어",station:"한큐 교토가와라마치역, 지하철 시조역 사이",

  {id:"babiesrus",label:"6",name:"토이저러스·베이비저러스 교토점",lat:34.98281,lon:135.75459,

   items:["콤비·아프리카 유모차","아기띠·슬링","피죤 젖병·젖꼭지","코흡입기·손톱가위","호빵맨 장난감·치발기"],
   pts:["이온몰 KYOTO 가에데관 1층 (南区西九条鳥居口町1)","10:00~21:00 (소개 사이트 기준, 공식 사이트에서 확인)","시내에서 가장 가까운 아기용품 전문점. 큰 짐은 마지막 날 사는 걸 추천"],

const label=(x,y,txt,cls,attrs={},parent=svg)=>{const t=el("text",Object.assign({x,y,class:cls},attrs),parent);t.textContent=txt;return t;};

el("rect",{x:0,y:0,width:W,height:H,fill:"var(--surface)"});

line([[35.00369,B.lonMin],[35.00369,135.76000]],{stroke:"var(--hankyu)","stroke-width":4,"stroke-dasharray":"6 5"});
line([[B.latMax,135.7598],[35.00369,135.7598],[34.99604,135.75910],[34.98535,135.75877],[B.latMin,135.7588]],{stroke:"var(--subway)","stroke-width":4,"stroke-linejoin":"round"});
line([[35.0110,B.lonMin],[35.01090,135.76887],[35.00902,135.77233],[35.0093,135.7790],[35.0060,135.7880]],{stroke:"var(--tozai)","stroke-width":4,"stroke-linejoin":"round"});
line([[B.latMax,135.7726],[35.00902,135.77233],[35.00269,135.77160],[34.99636,135.76867],[B.latMin,135.7700]],{stroke:"var(--keihan)","stroke-width":4,"stroke-linejoin":"round"});
{const [x,y]=P(35.0060,135.7880);label(x-6,y+16,"도자이선 → 로쿠지조","street-label",{"text-anchor":"end"}).style.fill="var(--tozai)";}

// 숙소 후보 (참고용)
hotels.forEach(([la,lo])=>{const [x,y]=P(la,lo);el("circle",{cx:x,cy:y,r:4.5,fill:"var(--hotel)",stroke:"var(--surface)","stroke-width":1.5});});

// 역
stations.forEach(st=>{const [x,y]=P(st.lat,st.lon);
  el("circle",{cx:x,cy:y,r:6.5,fill:"var(--surface)",stroke:"var(--ink)","stroke-width":2.2});
  label(x+st.dx,y+st.dy,st.name,"st-label",{"text-anchor":st.anchor});});

// 거리
const R=6371000,rad=d=>d*Math.PI/180;
const dist=(a,b)=>{const dLa=rad(b.lat-a.lat),dLo=rad(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const nearest=p=>stations.map(s=>({s,d:dist(p,s)})).sort((a,b)=>a.d-b.d);

const linkLine=el("line",{stroke:"var(--shop)","stroke-width":2,"stroke-dasharray":"4 4",visibility:"hidden"});
const linkText=el("text",{class:"st-label","text-anchor":"middle",visibility:"hidden"});
linkText.style.fill="var(--shop)";

// 매장 핀
const pins={};
const cx0=W/2,cy0=H/2;
shops.forEach(sh=>{
  const g=el("g",{class:"shop-pin",tabindex:"0",role:"button","aria-label":sh.name});
  if(sh.area){
    const [x,y]=P(sh.lat,sh.lon);const rr=sh.r*s;
    el("ellipse",{cx:x,cy:y,rx:rr*kx*1.3,ry:rr,fill:"var(--area)",stroke:"var(--shop)","stroke-width":1.5,"stroke-dasharray":"4 3","fill-opacity":.75},g);
    label(x,y+4,"D","edge-label",{"text-anchor":"middle"},g);
    pins[sh.id]={g,shape:g.firstChild,x,y};
  }else if(inside(sh.lat,sh.lon)){
    const [x,y]=P(sh.lat,sh.lon);
    const c=el("circle",{cx:x,cy:y,r:10,fill:"var(--shop)",stroke:"var(--surface)","stroke-width":2},g);
    label(x,y+4,sh.label,"s-num",{"text-anchor":"middle"},g);
    pins[sh.id]={g,shape:c,x,y};
  }else{
    // 지도 밖 매장: 가장자리 화살표
    const [tx,ty]=P(sh.lat,sh.lon);let dx=tx-cx0,dy=ty-cy0;
    const k=Math.min((W/2-26)/Math.abs(dx||1e-9),(H/2-26)/Math.abs(dy||1e-9));
    const x=cx0+dx*k,y=cy0+dy*k,ang=Math.atan2(dy,dx)*180/Math.PI;
    const c=el("circle",{cx:x,cy:y,r:11,fill:"var(--shop)",stroke:"var(--surface)","stroke-width":2},g);
    el("path",{d:"M0,-6 L10,0 L0,6 Z",fill:"var(--shop)",transform:`translate(${x+dx/Math.hypot(dx,dy)*14},${y+dy/Math.hypot(dx,dy)*14}) rotate(${ang})`},g);
    label(x,y+4,sh.label,"s-num",{"text-anchor":"middle"},g);
    const km=(dist(sh,{lat:35.0037,lon:135.7696})/1000).toFixed(1);
    const lx=x<W/2?x+16:x-16, anchor=x<W/2?"start":"end", ly=y+4;
    label(lx,ly,`${sh.name} · 가와라마치에서 약 ${km}km`,"edge-label",{"text-anchor":anchor},g);
    pins[sh.id]={g,shape:c,x,y,outside:true};
  }
  g.addEventListener("click",()=>select(sh.id,true));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(sh.id,true);}});
});

// 목록
const list=document.getElementById("list");
const cards={};
const groups=[["시내 (숙소 근처)",s=>!s.area&&["donki","takashimaya","daimaru"].includes(s.id)||s.area],["교토역 주변",s=>["isetan","bic","babiesrus"].includes(s.id)],["시내 밖 (아기용품 전문점)",s=>["momo","rakuhoku"].includes(s.id)]];
groups.forEach(([title,fn])=>{
  const h=document.createElement("div");h.className="group-title";h.textContent=title;list.appendChild(h);
  shops.filter(fn).forEach(sh=>{
    const near=nearest(sh).slice(0,1)[0];
    const mapsUrl="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(sh.q+" 京都");
    const b=document.createElement("div");b.className="card";b.tabIndex=0;b.setAttribute("role","button");b.setAttribute("aria-pressed","false");b.id="shop-"+sh.id;
    b.innerHTML=`<span class="num${sh.area?" area":""}">${sh.label}</span><div style="min-width:0">
      <h3>${sh.name}</h3><div class="sub">${sh.station}${sh.approx?" · 추정 위치":""}</div>
      <div class="meta"><span class="chip type">${sh.type}</span>${sh.items.map(i=>`<span class="chip${/확인/.test(i)?" warn":""}">${i}</span>`).join("")}</div>
      <div class="detail"><ul>${sh.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
        ${pins[sh.id]&&!pins[sh.id].outside?`<div>지도상 가장 가까운 역 (직선거리): ${near.s.name.split(" (")[0]} ${Math.round(near.d/10)*10}m</div>`:""}
        <a href="${mapsUrl}" target="_blank" rel="noopener">구글 지도에서 보기 ↗</a></div></div>`;
    b.addEventListener("click",e=>{if(e.target.closest("a"))return;const sel=window.getSelection&&window.getSelection().toString();if(sel)return;select(sh.id,false);});
    b.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target===b){e.preventDefault();select(sh.id,false);}});
    list.appendChild(b);cards[sh.id]=b;
  });
});

let current=null;
function select(id,fromMap){
  current=(current===id&&!fromMap)?null:id;
  shops.forEach(sh=>{const on=sh.id===current;cards[sh.id].setAttribute("aria-pressed",on);
    const p=pins[sh.id];p.shape.setAttribute("stroke-width",on?4:(sh.area?1.5:2));p.shape.setAttribute("stroke",on?"var(--ink)":(sh.area?"var(--shop)":"var(--surface)"));});
  linkLine.setAttribute("visibility","hidden");linkText.setAttribute("visibility","hidden");
  if(current==null)return;
  const sh=shops.find(x=>x.id===current),p=pins[current];
  if(!p.outside){
    const nr=nearest(sh)[0];const [x2,y2]=P(nr.s.lat,nr.s.lon);
    Object.entries({x1:p.x,y1:p.y,x2,y2}).forEach(([k,v])=>linkLine.setAttribute(k,v));
    linkText.setAttribute("x",(p.x+x2)/2);linkText.setAttribute("y",(p.y+y2)/2-8);
    linkText.textContent=`${Math.round(nr.d/10)*10}m · 도보 약 ${Math.max(1,Math.round(nr.d/80))}분`;
    linkLine.setAttribute("visibility","visible");linkText.setAttribute("visibility","visible");
    svg.appendChild(linkLine);svg.appendChild(linkText);
  }
  Object.values(pins).forEach(q=>{if(!q.g.querySelector("ellipse"))svg.appendChild(q.g);});
  if(fromMap)cards[current].scrollIntoView({block:"nearest",behavior:"smooth"});
}
select("babiesrus",false);
</script>
</body>
</html>
